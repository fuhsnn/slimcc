name: ci

on: [push, pull_request, workflow_dispatch]

jobs:
  build-docker:
    strategy:
      matrix:
        include:
          - { vm: main, file: debian_asan_13 }
    uses: ./.github/workflows/docker_build_upload.yml
    with:
      vm: ${{ matrix.vm }}
      file: ${{ matrix.file }}

  run0:
    needs: build-docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - { vm: main, proj: test_xxhash }
    uses: ./.github/workflows/docker_download_run.yml
    with:
      vm: ${{ matrix.vm }}
      proj: ${{ matrix.proj }}

